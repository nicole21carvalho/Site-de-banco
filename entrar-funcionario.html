<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar como funcionário · Banco Tech.In.Fin</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="entrar">
  <header data-componente="cabecalho"></header>

  <main id="conteudo" class="tela-dividida">
    <div class="tela-dividida__imagem" role="img" aria-label="Fachada de prédio moderno"></div>
    <div class="tela-dividida__conteudo">
      <div class="caixa">
        <h1>Área do funcionário</h1>
        <p>Entre com o seu e-mail corporativo.</p>

        <form data-formulario data-redirecionar="funcionario/painel.html" novalidate>
          <div class="campo campo--escuro">
            <label for="email">E-mail corporativo</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="nome@techinfin.com.br" required>
            <span class="erro">Informe um e-mail válido.</span>
          </div>
          <div class="campo campo--escuro">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required minlength="6">
            <span class="erro">A senha tem pelo menos 6 caracteres.</span>
          </div>
          <label class="lembrar"><input type="checkbox" name="lembrar"> Manter conectado</label>
          <button class="botao botao--vermelho botao--bloco botao--grande" type="submit">Entrar</button>
        </form>

        <p class="aviso aviso--escuro"><i class="bi bi-info-circle" aria-hidden="true"></i>
          Protótipo: não há servidor. Qualquer e-mail válido e senha com 6+ caracteres abre o painel de demonstração.</p>
        <a class="voltar" href="entrar.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar</a>
      </div>
    </div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/validacao.js"></script>
  <script src="js/formularios.js"></script>
</body>
</html>
