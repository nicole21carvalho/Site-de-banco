<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investimentos · Banco Tech.In.Fin</title>
  <link rel="icon" href="../img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-raiz="../" data-area="cliente" data-pagina="investimentos">
  <div class="area">
    <aside data-componente="lateral"></aside>

    <main class="principal" id="conteudo">
      <header data-componente="barra-topo"></header>
      <h1 class="titulo-pagina">Formulário de investimento</h1>

      <form class="paineis" data-formulario novalidate>
        <section class="painel" aria-labelledby="titulo-aplicacao">
          <h2 id="titulo-aplicacao">Aplicação</h2>
          <fieldset class="campo">
            <legend>Tipo de investimento</legend>
            <div class="opcoes">
              <label class="opcao"><input type="radio" name="tipo" value="CDB Tech.In.Fin" required> CDB Tech.In.Fin · rende 124% do CDI</label>
              <label class="opcao"><input type="radio" name="tipo" value="Tesouro Selic"> Tesouro Selic · rende 100% da Selic</label>
              <label class="opcao"><input type="radio" name="tipo" value="LCI"> LCI · rende 95% do CDI, isenta de IR</label>
            </div>
            <span class="erro">Escolha um investimento.</span>
          </fieldset>
          <div class="campo">
            <label for="valor">Valor a ser aplicado</label>
            <input id="valor" name="valor" inputmode="numeric" placeholder="R$ 0,00" required data-moeda data-minimo="1" aria-describedby="minimo-investimento">
            <small id="minimo-investimento">Aplicação mínima: R$ 1,00.</small>
            <span class="erro">A aplicação mínima é de R$ 1,00.</span>
          </div>
        </section>

        <section class="painel" aria-labelledby="titulo-termos">
          <h2 id="titulo-termos">Termos de consentimento</h2>
          <div class="termos">
            <label class="opcao"><input type="checkbox" name="privacidade" required> Eu aceito os <a href="#">termos de privacidade</a></label>
            <label class="opcao"><input type="checkbox" name="servicos" required> Eu aceito os <a href="#">termos de contratação de serviços</a></label>
          </div>
          <button class="botao botao--vermelho botao--grande botao--bloco" type="submit" style="margin-top: 24px;">Investir</button>
          <p class="aviso aviso--sucesso" role="status" hidden data-sucesso="Aplicação de {valor} em {tipo} realizada com sucesso."></p>
        </section>
      </form>
    </main>
  </div>

  <script src="../js/layout.js"></script>
  <script src="../js/validacao.js"></script>
  <script src="../js/formularios.js"></script>
</body>
</html>
